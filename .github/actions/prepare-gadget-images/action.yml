name: "Prepare gadget images"
description: "Import, publish, and sign gadget images for testing."

inputs:
  ig:
    description: "Path to the ig binary."
    default: "ig"
  gadget-repository:
    description: "Source repository of the gadget images in the archive."
    required: true
  gadget-tag:
    description: "Tag of the gadget images in the archive."
    required: true
  registry:
    description: "Address of the registry service."
    default: "127.0.0.1:5000"

outputs:
  gadget-repository:
    description: "Repository containing the signed gadget images."
    value: ${{ steps.prepare.outputs.registry }}
  gadget-insecure-registry:
    description: "HTTP registry endpoint allowed for gadget images."
    value: ${{ steps.prepare.outputs.registry }}
  gadget-public-key:
    description: "Base64-encoded public key used to sign the gadget images."
    value: ${{ steps.prepare.outputs.public-key }}

runs:
  using: "composite"
  steps:
    - name: Download gadget images
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: gadget-images
        path: ${{ runner.temp }}/gadget-images
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Import, publish, and sign gadget images
      id: prepare
      shell: bash
      env:
        IG: ${{ inputs.ig }}
        GADGET_REPOSITORY: ${{ inputs.gadget-repository }}
        GADGET_TAG: ${{ inputs.gadget-tag }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        : "${GADGET_REPOSITORY:?gadget-repository is required}"
        : "${GADGET_TAG:?gadget-tag is required}"
        : "${REGISTRY:?registry is required}"

        archive="${RUNNER_TEMP}/gadget-images/gadgets.tar"
        key_prefix="${RUNNER_TEMP}/gadget-images/cosign"

        sudo "${IG}" image import "${archive}"
        curl --fail --silent --show-error --max-time 5 \
          --retry 30 --retry-all-errors --retry-delay 2 \
          "http://${REGISTRY}/v2/" > /dev/null

        COSIGN_PASSWORD='' cosign generate-key-pair --output-key-prefix "${key_prefix}"

        gadgets="$(make -s -C gadgets/ list-gadgets)"
        : "${gadgets:?No gadget images to publish}"
        while IFS= read -r gadget; do
          source="${GADGET_REPOSITORY}/${gadget}:${GADGET_TAG}"
          destination="${REGISTRY}/${gadget}:${GADGET_TAG}"
          sudo "${IG}" image tag "${source}" "${destination}"

          for attempt in {1..5}; do
            if sudo "${IG}" image push "${destination}" --insecure-registries "${REGISTRY}"; then
              break
            fi
            if [[ "${attempt}" == 5 ]]; then
              echo "Failed to push ${destination}" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

          digest="$(sudo "${IG}" image inspect "${destination}" --verify-image=false -o json | jq -r .Digest)"
          cosign sign \
            --allow-http-registry \
            --key "${key_prefix}.key" \
            --recursive \
            --tlog-upload=false \
            --yes \
            "${destination}@${digest}"
          sudo "${IG}" image verify \
            --insecure-registries "${REGISTRY}" \
            --public-keys "$(cat "${key_prefix}.pub")" \
            "${destination}"
        done <<< "${gadgets}"

        rm "${key_prefix}.key"
        echo "registry=${REGISTRY}" >> "${GITHUB_OUTPUT}"
        echo "public-key=$(base64 -w0 "${key_prefix}.pub")" >> "${GITHUB_OUTPUT}"
